# Valid EnvSentry configuration for testing

[variables.DATABASE_URL]
type = "url"
required = true
secret = true
description = "Database connection string"

[variables.API_KEY]
type = "string"
required = true
secret = true
min_length = 10
description = "API authentication key"

[variables.DEBUG]
type = "boolean"
required = false
description = "Enable debug mode"

[variables.PORT]
type = "integer"
required = false
min = 1024
max = 65535
description = "Server port"

[variables.ENVIRONMENT]
type = "string"
required = true
choices = ["development", "staging", "production"]
description = "Deployment environment"
