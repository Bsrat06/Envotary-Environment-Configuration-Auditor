version = 1

[project]
name = "test-project"

[variables.API_KEY]
required = true
type = "string"

[variables.DATABASE_URL]
required = true
type = "url"

[variables.DEBUG]
required = true
type = "boolean"

[variables.PORT]
required = true
type = "integer"
min = 1
max = 65535

[variables.ENVIRONMENT]
required = false
type = "string"
choices = ["development", "staging", "production"]

[variables.SECRET_TOKEN]
required = true
type = "string"
min_length = 32
