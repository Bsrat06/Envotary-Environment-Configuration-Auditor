[project]
name = "basic-example"
description = "Basic example project demonstrating EnvSentry configuration"

[files]
env_file = ".env"
example_file = ".env.example"

[settings]
require_example_file = true
allow_extra_variables = false

[variables.API_KEY]
type = "string"
required = true
secret = true
min_length = 10

[variables.DATABASE_URL]
type = "url"
required = true
secret = true

[variables.DEBUG]
type = "boolean"
required = true

[variables.PORT]
type = "integer"
required = true
min = 1024
max = 65535

[variables.ENVIRONMENT]
type = "string"
required = true
choices = ["development", "staging", "production"]
